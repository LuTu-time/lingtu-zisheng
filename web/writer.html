<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵途自生 · 小说工作台</title>
<style>
.layout{display:grid;grid-template-columns:minmax(215px,255px) minmax(420px,1fr) minmax(270px,330px);min-height:calc(100vh - 63px);max-width:1980px;margin:auto}
.side{padding:22px 18px;min-width:0;overflow:auto}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px}
.section-title h2{margin:0;font:600 15px var(--serif)}
.section-title button{padding:2px 10px;min-height:30px;font-size:12px}
.chapter-list{list-style:none;padding:0;margin:0}
.chapter-list button{display:block;width:100%;min-height:46px;padding:10px;border:1px solid transparent;background:transparent;text-align:left;line-height:1.45;border-radius:var(--r)}
.chapter-list button:hover:not(:disabled){background:var(--shade);color:var(--ink);transform:none}
.chapter-list button.selected{background:var(--white);border-color:var(--line);color:var(--moss-deep);font-weight:600}
.chapter-list small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.paper-wrap{padding:0;min-width:0}
.paper{padding:30px clamp(20px,3vw,44px) 60px;background:var(--white);border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100%}
.context{margin:0 0 16px;font:12px var(--mono);color:var(--muted)}
.editor-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.editor-head .actions{display:flex;gap:8px}
.title-input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;padding:10px 0;font:500 24px var(--serif);margin:8px 0 12px}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.body-input{width:100%;min-height:46vh;border:0;background:transparent;border-radius:0;padding:0;font:15px/1.9 var(--serif);resize:vertical}
.body-input:focus{outline:none}
.meta{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.notes{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.notes textarea{min-height:90px;font-size:13px}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.person-select{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:0;padding:9px 10px;border:1px solid transparent;background:transparent;border-radius:var(--r)}
.person-select:hover:not(:disabled){background:var(--shade);color:var(--ink);transform:none}
.person-select.selected{background:var(--white);border-color:var(--accent)}
.person-select strong,.person-select small{display:block}
.person-select small{color:var(--muted);font-size:12px;font-weight:400}
.person-summary{margin:10px 0;color:var(--muted);line-height:1.55;font-size:12px}
.person-summary strong{color:var(--ink)}
.event{padding:11px 0;border-bottom:1px solid var(--line)}
.event time{display:block;font:11px var(--mono);color:var(--muted);margin-bottom:4px}
.event p{margin:0 0 8px}
.event button{min-height:32px;padding:2px 10px;font-size:12px;margin-right:6px}
.ref{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;font-size:12px}
@media(max-width:1180px){.layout{grid-template-columns:minmax(190px,220px) minmax(360px,1fr)}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:820px){.layout{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}.paper{border-left:0;border-right:0}}
</style>
<link rel="stylesheet" href="/app.css">
</head><body>
<header class="top"><div class="brand"><strong>灵途自生</strong> <small>小说写作工作台</small></div><nav class="nav" aria-label="主导航"><a href="/">入世</a><a href="/write" class="active">小说写作台</a><a href="/simulation">世界观察台</a><span class="state" id="connection">连接中</span></nav></header>
<main class="layout"><aside class="side left"><section><div class="section-title"><h2>章节草稿</h2><span style="display:flex;gap:6px"><button id="export-md" title="导出全书为 Markdown">导出 MD</button><button id="export-txt" title="导出全书为纯文本">TXT</button><button id="new-chapter" title="新建章节">＋ 新章</button></span></div><ul class="chapter-list" id="chapters"><li class="empty">读取章节中</li></ul></section><section class="people"><div class="section-title"><h2>人物档案</h2></div><div id="people"></div><div id="person-summary" class="person-summary" aria-live="polite">选择人物，查看其目标与真实经历。</div></section></aside>
<section class="paper-wrap" aria-label="章节编辑器"><div class="paper"><p class="context" id="world-context">正在读取小说世界</p><div class="editor-head"><span id="editor-state">新章节 · 尚未保存</span><div class="actions"><button id="suggest" type="button">从引用事件生成草稿（本地模型）</button><button class="primary" id="save">保存章节</button></div></div><input id="chapter-title" class="title-input" maxlength="120" placeholder="写下章节标题" aria-label="章节标题"><textarea id="chapter-body" class="body-input" maxlength="200000" placeholder="从这一刻开始写故事。右侧可以引用世界中已发生的事。" aria-label="章节正文"></textarea><div class="meta"><span id="word-count">0 字</span><span id="revision">草稿可反复修改 · 世界历史不可改写</span></div><div class="notes"><label for="chapter-notes">写作备忘</label><textarea id="chapter-notes" maxlength="20000" placeholder="记录伏笔、人物动机、下一章要处理的线索。"></textarea><p class="note">写作备忘和章节草稿可编辑；右侧引用的世界事件不会随草稿修改而改变。</p></div></div></section>
<aside class="side right"><section><div class="section-title"><h2>设定候选</h2></div><input type="file" id="canon-file" accept=".txt,text/plain" aria-label="选择 TXT 设定"><textarea id="canon-text" maxlength="100000" rows="4" placeholder="每行一条候选设定"></textarea><button id="preview-canon" type="button">预览候选</button><button id="extract-entities" type="button">抽取人物/地点</button><div id="canon-candidates" aria-live="polite"></div><div id="import-candidates" aria-live="polite"></div><div class="notes"><label for="canon-subject">结构化设定</label><input id="canon-subject" maxlength="100" placeholder="对象，如：河谷古桥" aria-label="设定对象"><input id="canon-attribute" maxlength="100" placeholder="属性，如：建造年代" aria-label="设定属性"><input id="canon-value" maxlength="100" placeholder="取值，如：三百年前" aria-label="设定取值"><button id="confirm-claim" type="button">确认结构化设定</button></div></section><section><div class="section-title"><h2>已确认设定</h2><button id="reload-canon" type="button">刷新</button></div><div id="canon-list" class="empty">加载中</div><p>设定分三态：原作·只读 ＞ 作者·只读 ＞ 推断·可改。推断事实可被上位覆盖，也可一键提升。</p></section><section><div class="section-title"><h2>年度纪事</h2></div><div id="annual-chronicle" aria-live="polite"></div></section><section><div class="section-title"><h2>世界素材 · 已发生</h2><button id="all-events" type="button">全部事件</button><button id="reload" title="刷新素材">刷新</button></div><div id="events" class="empty">加载世界事件中</div><button id="older-events" type="button" hidden>更早的事件</button></section><section class="world"><div class="section-title"><h2>本章引用</h2></div><div id="references" class="empty">尚未选取世界事件。</div><p>引用是真实事件的编号，不会复制或改写事件内容。保存后可在章节中继续调整。</p></section></aside></main>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));let current=null,refs=[],events=[],allEvents=[],eventCache=new Map(),selectedPerson=null,personRequest=0,olderBusy=false,hasOlder=false,dirty=false,busy=false,noticeTimer;
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json"}});const data=await r.json();if(!r.ok)throw new Error(data.error||"请求失败");return data}
function notify(s){const el=$("notice");el.textContent=s;el.classList.add("visible");clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove("visible"),3500)}
function markDirty(){dirty=true;$("editor-state").textContent="有未保存的修改";$("word-count").textContent=$('chapter-body').value.replace(/\s/g,"").length+" 字"}
function confirmChange(){return !dirty||confirm("当前章节有未保存的内容，确定放弃这些修改吗？")}
function renderRefs(){$("references").innerHTML=refs.length?refs.map(id=>`<div class="ref"><span>#${id} · ${esc(eventCache.get(id)?.summary||"已引用的旧事件")}</span><button data-remove="${id}" aria-label="移除引用 ${id}">×</button></div>`).join(""):'<div class="empty">尚未选取世界事件。</div>';document.querySelectorAll("[data-add]").forEach(b=>{b.disabled=refs.includes(Number(b.dataset.add))})}
function renderEvents(){ $("events").innerHTML=events.length?events.map(e=>`<article class="event"><time>第 ${Math.floor(e.tick/24)} 日 · #${e.id}</time><p>${esc(e.summary)}</p><button type="button" data-add="${e.id}" aria-label="引用事件 ${e.id}">引用到本章</button><button type="button" data-why="${e.id}" aria-label="查看事件 ${e.id} 的因果">追溯因果</button></article>`).join(""):'<div class="empty">没有找到相关的已发生事件。</div>';$('older-events').hidden=selectedPerson!==null||!hasOlder;renderRefs()}
async function loadOlder(){if(olderBusy||selectedPerson!==null||!hasOlder||!allEvents.length)return;olderBusy=true;const before=allEvents[allEvents.length-1].id;$('older-events').disabled=true;try{const page=await api(`/api/events?limit=30&before=${before}`);if(selectedPerson!==null||!allEvents.length||allEvents[allEvents.length-1].id!==before)return;allEvents.push(...page);for(const event of page)eventCache.set(event.id,event);hasOlder=page.length===30;events=allEvents;renderEvents()}catch(err){notify(err.message)}finally{olderBusy=false;$('older-events').disabled=false}}
async function loadAnnual(){try{const status=await api('/api/status');const year=Math.max(1,Math.ceil(status['第几日']/120));const report=await api(`/api/chronicle/annual?year=${year}`);$('annual-chronicle').innerHTML=`<p>第 ${year} 年${report.complete?' · 已结算':' · 进行中'}</p>`+report.facts.filter(f=>f.count).map(f=>`<p>${esc(f.topic)}：${esc(f.summary)} <small>事件 ${f.event_ids.map(id=>'#'+id).join('、')}</small></p>`).join('') }catch(err){notify(err.message)}}
$('canon-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>300000){notify('TXT 文件过大');return}$('canon-text').value=await file.text()};
$('preview-canon').onclick=async()=>{try{const result=await api('/api/canon/preview',{method:'POST',body:JSON.stringify({text:$('canon-text').value})});$('canon-candidates').innerHTML=result.candidates.map((line,i)=>`<p>${esc(line)} <button type="button" data-confirm-canon="${i}">确认设定</button></p>`).join('');$('canon-candidates').dataset.lines=JSON.stringify(result.candidates)}catch(err){notify(err.message)}};
$('extract-entities').onclick=async()=>{const text=$('canon-text').value;if(!text.trim()){notify('请先粘贴或载入 TXT 原文');return}const button=$('extract-entities');button.disabled=true;try{const r=await api('/api/import/preview',{method:'POST',body:JSON.stringify({text})});$('import-candidates').innerHTML=(r.candidates.length?r.candidates.map((c,i)=>`<p>${esc(c.content)} <small>${esc(c.note)}</small> <button type="button" data-confirm-import="${i}">确认</button></p>`).join('')+'<p><button type="button" id="commit-import">确认全部抽取结果</button></p>':'<p>未抽取到高频人物/地点，可换更长的原文。</p>')+(r.persons.length?`<p>主要人物：${r.persons.map(p=>esc(p.name)).join('、')}<button type="button" id="cast-all">全部建成世界角色</button></p>`:'')+(r.relations.length?`<p>候选关系：${r.relations.map((x,i)=>`${esc(x.a)}—${esc(x.b)}（${esc(x.role)}）<button type="button" data-relate="${i}">建立</button>`).join(' ')}<button type="button" id="relate-all">全部建立</button></p>`:'');$('import-candidates').dataset.cands=JSON.stringify(r.candidates);$('import-candidates').dataset.persons=JSON.stringify(r.persons);$('import-candidates').dataset.relations=JSON.stringify(r.relations);notify(`抽取到 ${r.persons.length} 个人物、${r.places.length} 个地点`)}catch(err){notify(err.message)}finally{button.disabled=false}};
$('import-candidates').onclick=async e=>{const persons=JSON.parse($('import-candidates').dataset.persons||'[]');const rels=JSON.parse($('import-candidates').dataset.relations||'[]');const post=(body,btn,label)=>api('/api/import/relate',{method:'POST',body:JSON.stringify(body)}).then(async r=>{notify(`${label}：建立 ${r.count} 条${r.skipped.length?`，跳过 ${r.skipped.length} 条（需双方都已建角）`:''}`);await loadWorld()}).catch(err=>{if(btn){btn.disabled=false}notify(err.message)});if(e.target.id==='relate-all'){if(!rels.length){notify('没有可建立的关系');return}e.target.disabled=true;return post({links:rels.map(x=>({a:x.a,b:x.b,role:x.role,kind:x.kind,intensity:x.intensity}))},null,'全部关系')}const rbtn=e.target.closest('[data-relate]');if(rbtn){const x=rels[Number(rbtn.dataset.relate)];rbtn.disabled=true;return post({links:[{a:x.a,b:x.b,role:x.role,kind:x.kind,intensity:x.intensity}]},rbtn,'关系')}if(e.target.id==='cast-all'){if(!persons.length){notify('没有可建的人物');return}const b=e.target;b.disabled=true;try{const r=await api('/api/import/cast',{method:'POST',body:JSON.stringify({persons:persons.map(p=>({name:p.name}))})});notify(`已建成 ${r.count} 位世界角色`);await loadWorld();await loadCanon()}catch(err){b.disabled=false;notify(err.message)}return}if(e.target.id==='commit-import'){const cands=JSON.parse($('import-candidates').dataset.cands||'[]');if(!cands.length){notify('没有可确认的候选');return}try{const r=await api('/api/import/commit',{method:'POST',body:JSON.stringify({candidates:cands})});notify(`已写入 ${r.count} 条设定`);$('import-candidates').innerHTML='';await loadCanon();await loadAnnual()}catch(err){notify(err.message)}return}const b=e.target.closest('[data-confirm-import]');if(!b)return;const cands=JSON.parse($('import-candidates').dataset.cands||'[]');const c=cands[Number(b.dataset.confirmImport)];b.disabled=true;try{await api('/api/import/commit',{method:'POST',body:JSON.stringify({candidates:[c]})});b.textContent='已确认';await loadCanon()}catch(err){b.disabled=false;notify(err.message)}};
$('canon-candidates').onclick=async e=>{const button=e.target.closest('[data-confirm-canon]');if(!button)return;const lines=JSON.parse($('canon-candidates').dataset.lines||'[]');button.disabled=true;try{await api('/api/canon',{method:'POST',body:JSON.stringify({content:lines[Number(button.dataset.confirmCanon)],source:'author',note:'写作台确认'})});button.textContent='已确认';await loadAnnual();await loadCanon()}catch(err){button.disabled=false;notify(err.message)}};
$('confirm-claim').onclick=async()=>{const subject=$('canon-subject').value.trim(),attribute=$('canon-attribute').value.trim(),value=$('canon-value').value.trim();if(!subject||!attribute||!value){notify('请填写对象、属性和取值');return}const button=$('confirm-claim');button.disabled=true;try{await api('/api/canon',{method:'POST',body:JSON.stringify({subject,attribute,value,source:'author',note:'写作台结构化确认'})});notify('结构化设定已确认');$('canon-value').value='';await loadAnnual();await loadCanon()}catch(err){notify(err.message)}finally{button.disabled=false}};
function showAllEvents(){personRequest++;selectedPerson=null;events=allEvents;$("person-summary").textContent="选择人物，查看其目标与真实经历。";document.querySelectorAll("[data-person]").forEach(b=>b.classList.remove("selected"));renderEvents()}
async function selectPerson(id){const request=++personRequest;try{const person=await api(`/api/people/detail?id=${id}`);if(request!==personRequest)return;selectedPerson=id;events=person.events;for(const event of events)eventCache.set(event.id,event);$("person-summary").innerHTML=`<strong>${esc(person.name)}</strong> · 当前目标：${esc((person.goal_stack||[]).join("、")||"暂无目标")}<br>下方仅展示此人物参与的真实事件；记忆属于人物主观视角。`;document.querySelectorAll("[data-person]").forEach(b=>b.classList.toggle("selected",Number(b.dataset.person)===id));renderEvents()}catch(err){if(request===personRequest)notify(err.message)}}
function setChapter(c){current=c;refs=JSON.parse(c?.event_ids||"[]");$("chapter-title").value=c?.title||"";$("chapter-body").value=c?.body||"";$("chapter-notes").value=c?.notes||"";$("revision").textContent=c?`第 ${c.revision} 版 · 可继续修订`:"草稿可反复修改 · 世界历史不可改写";$("editor-state").textContent=c?`章节 #${c.id} · 已保存`:"新章节 · 尚未保存";dirty=false;$("word-count").textContent=$("chapter-body").value.replace(/\s/g,"").length+" 字";renderRefs();document.querySelectorAll("[data-chapter]").forEach(b=>b.classList.toggle("selected",Number(b.dataset.chapter)===c?.id))}
async function hydrateRefs(){const chapter=current,missing=refs.filter(id=>!eventCache.has(id));if(!missing.length)return;try{const found=await api(`/api/events?ids=${missing.join(",")}`);for(const event of found)eventCache.set(event.id,event);if(current===chapter)renderRefs()}catch(err){notify(err.message)}}
async function openChapter(c){setChapter(c);await hydrateRefs()}
async function chapters(){const data=await api("/api/chapters");$("chapters").innerHTML=data.length?data.map(c=>`<li><button data-chapter="${c.id}" class="${c.id===current?.id?"selected":""}">${esc(c.title)}<small>${c.characters} 字 · 版本 ${c.revision}</small></button></li>`).join(""):'<li class="empty">还没有章节。先写下第一章。</li>'}
async function loadWorld(){const [state,people,history]=await Promise.all([api("/api/status"),api("/api/people"),api("/api/events?limit=30")]);$("world-context").textContent=`${state["世界"]} · ${state["聚落"]} · 世界第 ${state["第几日"]} 日 · ${state.history_ok?"历史链完整":"历史异常"}`;$("people").innerHTML=people.filter(p=>p.status==="alive").slice(0,24).map(p=>`<button type="button" class="person person-select" data-person="${p.id}"><strong>${esc(p.name)}</strong><small>${esc(p.occupation)} · ${esc((p.goal_stack||[])[0]||"暂无目标")}</small></button>`).join("");allEvents=history;hasOlder=history.length===30;for(const event of history)eventCache.set(event.id,event);if(selectedPerson){await selectPerson(selectedPerson)}else showAllEvents();$("connection").textContent="本机已连接"}
async function loadCanon(){try{const rows=await api('/api/canon');const label={canon:'原作·只读',author:'作者·只读',inference:'推断·可改',background:'背景',contract:'契约',other:'其他'};$('canon-list').innerHTML=rows.length?rows.map(f=>{const up=f.state==='inference'?` <button type="button" data-promote="${f.id}">提升为作者确认</button>`:'';return `<p>#${f.id} <b>${esc(label[f.state]||f.state)}</b> ${esc(f.content)}${up}</p>`}).join(''):'暂无设定'}catch(e){notify(e.message)}}
$('canon-list').onclick=async e=>{const b=e.target.closest('[data-promote]');if(!b)return;b.disabled=true;try{await api('/api/canon/promote',{method:'POST',body:JSON.stringify({fact_id:Number(b.dataset.promote),to:'author'})});notify('已提升为作者确认');await loadCanon();await loadAnnual();await loadCanon()}catch(err){b.disabled=false;notify(err.message)}};
$('reload-canon').onclick=()=>loadCanon();
async function start(){try{await Promise.all([chapters(),loadWorld(),loadAnnual(),loadCanon()]);const first=document.querySelector("[data-chapter]");if(first){const c=await api(`/api/chapters/${first.dataset.chapter}`);await openChapter(c)}}catch(e){$("connection").textContent="连接失败";notify(e.message)}}
$("people").onclick=e=>{const button=e.target.closest("[data-person]");if(button)selectPerson(Number(button.dataset.person))};
$("all-events").onclick=showAllEvents;
$("older-events").onclick=loadOlder;
$("new-chapter").onclick=()=>{if(confirmChange())setChapter(null)};
$("export-md").onclick=()=>{location.href="/api/chapters/export?format=md"};
$("export-txt").onclick=()=>{location.href="/api/chapters/export?format=txt"};
$("chapters").onclick=async e=>{const b=e.target.closest("[data-chapter]");if(!b||!confirmChange())return;try{await openChapter(await api(`/api/chapters/${b.dataset.chapter}`))}catch(err){notify(err.message)}};
$("events").onclick=async e=>{const add=e.target.closest("[data-add]");if(add){const id=Number(add.dataset.add);if(!refs.includes(id)){refs.push(id);renderRefs();markDirty()}return}const why=e.target.closest("[data-why]");if(why){try{const chain=await api(`/api/why/${Number(why.dataset.why)}`);notify(chain.map(item=>`#${item.id} ${item.summary}`).join(" ← "))}catch(err){notify(err.message)}}};
$("references").onclick=e=>{const b=e.target.closest("[data-remove]");if(!b)return;refs=refs.filter(id=>id!==Number(b.dataset.remove));renderRefs();markDirty()};
$("reload").onclick=async()=>{try{await Promise.all([loadWorld(),loadAnnual()]);notify("世界素材已刷新")}catch(err){notify(err.message)}};
$("suggest").onclick=async()=>{if(busy)return;if(!refs.length){notify("先引用至少一条世界事件");return}busy=true;$("suggest").disabled=true;try{const result=await api("/api/chapters/suggest",{method:"POST",body:JSON.stringify({event_ids:refs.slice(0,8),direction:$("chapter-notes").value.slice(0,500)})});const body=$("chapter-body");body.value+=(body.value.trim()?"\n\n":"")+result.text;markDirty();notify("已加入可编辑草稿；请核对事实并手动保存")}catch(err){notify(err.message)}finally{busy=false;$("suggest").disabled=false}};
["chapter-title","chapter-body","chapter-notes"].forEach(id=>$(id).addEventListener("input",markDirty));
$("save").onclick=async()=>{if(busy)return;const title=$("chapter-title").value.trim();if(!title){notify("先写下章节标题");$("chapter-title").focus();return}busy=true;$("save").disabled=true;try{const data={title,body:$("chapter-body").value,notes:$("chapter-notes").value,event_ids:refs};if(current){data.id=current.id;data.revision=current.revision}const saved=await api("/api/chapters",{method:"POST",body:JSON.stringify(data)});setChapter(saved);await chapters();notify("章节已保存到本机存档")}catch(e){notify(e.message)}finally{busy=false;$("save").disabled=false}};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
start();
</script>
</body></html>
